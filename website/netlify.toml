[build]
  command = "pnpm build"
  publish = "dist"

# Astro 7 needs Node >= 22.23.4; built locally with Node 24.
[build.environment]
  NODE_VERSION = "24"

# Hashed build assets never change under the same name.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Screenshots keep their names across captures, so revalidate daily.
[[headers]]
  for = "/screens/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/pagefind/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Moved pages. Mirrors public/_redirects, which is what applies to zip
# deploys (the toml file is not read from an uploaded dist).
[[redirects]]
  from = "/components/foundation/*"
  to = "/components/"
  status = 301
  force = true

[[redirects]]
  from = "/components/interaction/*"
  to = "/components/"
  status = 301
  force = true

[[redirects]]
  from = "/concepts/motion/*"
  to = "/foundations/motion/"
  status = 301
  force = true

[[redirects]]
  from = "/concepts/localization/*"
  to = "/foundations/localization/"
  status = 301
  force = true
