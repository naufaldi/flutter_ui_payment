name: rakit_ui
description: >-
  Composable Flutter UI for mobile product screens, including a dedicated
  Payments category for checkout, payment status, receipts and optional KYC.
version: 0.9.0
homepage: https://rakit-ui.netlify.app
documentation: https://rakit-ui.netlify.app/start/quick-start/
repository: https://github.com/naufaldi/flutter_ui_payment
issue_tracker: https://github.com/naufaldi/flutter_ui_payment/issues
platforms:
  android:
  ios:

topics:
  - payments
  - checkout
  - kyc
  - ui
  - design-system

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_lints: ^6.0.0

