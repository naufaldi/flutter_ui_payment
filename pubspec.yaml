name: rakit_ui
description: >-
  Rakit UI: composable Flutter UI for optional identity verification (KYC), checkout,
  host-owned authorization, payment instructions, payment status and receipts.
  Host callbacks own every business decision; the package never moves money.
version: 0.2.0
homepage: https://rakit-ui.netlify.app
documentation: https://rakit-ui.netlify.app/start/quick-start/
repository: https://github.com/naufaldi/flutter_ui_payment
issue_tracker: https://github.com/naufaldi/flutter_ui_payment/issues
platforms:
  android:
  ios:

topics:
  - payments
  - checkout
  - kyc
  - ui
  - design-system

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
